<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hasan POS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B4D3C">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.js" defer></script>
<style>
  :root{
    --primary:#0B4D3C;
    --primary-dark:#082F24;
    --primary-light:#146652;
    --primary-tint:#E4EEE9;
    --accent:#E7A339;
    --accent-dark:#C6851E;
    --bg:#F6F3EC;
    --surface:#FFFFFF;
    --text:#1E2A26;
    --text-muted:#71807A;
    --border:#E6E0D2;
    --danger:#C0392B;
    --danger-tint:#FBECEA;
    --success:#2E8B57;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --font:'Manrope','Noto Sans Myanmar','Myanmar Text',system-ui,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  #app-shell{
    width:100%; max-width:480px; min-height:100vh; background:var(--bg);
    display:flex; flex-direction:column; position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.08);
  }
  @media (min-width:481px){
    body{ background:#EDE8DC; padding:24px 0; }
    #app-shell{ max-width:min(94vw, 1100px); min-height:calc(100vh - 48px); border-radius:28px; overflow:hidden; }
    .sheet{ max-width:min(94vw, 1100px); }
  }

  /* ---------- Header ---------- */
  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; background:var(--primary); color:#fff;
    position:sticky; top:0; z-index:20;
  }
  #topbar .brand{ display:flex; align-items:center; gap:10px; }
  #topbar .brand-mark{
    width:34px; height:34px; border-radius:10px; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--primary-dark); font-size:16px;
  }
  #topbar .shop-name{ font-weight:700; font-size:15px; line-height:1.1; }
  #topbar .shop-sub{ font-size:11px; opacity:.75; margin-top:2px; }
  #sync-dot-wrap{ display:flex; align-items:center; gap:6px; font-size:11px; opacity:.9; cursor:pointer; padding:6px 8px; border-radius:20px; background:rgba(255,255,255,0.08);}
  #sync-dot{ width:8px; height:8px; border-radius:50%; background:#7ED9A6; }
  #sync-dot.syncing{ background:var(--accent); animation:pulse 1s infinite; }
  #sync-dot.err{ background:#E76A5C; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---------- Main scroll area ---------- */
  #screen{ flex:1; overflow-y:auto; padding:16px 16px 100px; }
  #screen::-webkit-scrollbar{ display:none; }

  h1,h2,h3{ margin:0; }
  .section-title{ font-size:14px; font-weight:700; color:var(--text); margin:22px 0 10px; }
  .section-title:first-child{ margin-top:0; }
  .muted{ color:var(--text-muted); }

  /* ---------- Cards ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    padding:14px; position:relative; overflow:hidden;
  }
  .stat-card .label{ font-size:12px; color:var(--text-muted); font-weight:600; }
  .stat-card .value{ font-size:22px; font-weight:800; margin-top:6px; color:var(--primary-dark); }
  .stat-card.accent .value{ color:var(--accent-dark); }
  .stat-card .unit{ font-size:12px; font-weight:600; color:var(--text-muted); margin-left:2px;}

  .hero-card{
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
    color:#fff; border-radius:var(--radius-lg); padding:20px; margin-bottom:18px;
  }
  .hero-card .hero-label{ font-size:12px; opacity:.8; font-weight:600; }
  .hero-card .hero-value{ font-size:32px; font-weight:800; margin-top:4px; }
  .hero-card .hero-foot{ display:flex; gap:16px; margin-top:14px; font-size:12px; opacity:.9; }
  .hero-card .hero-foot b{ font-size:14px; display:block; }

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--font); border:none; cursor:pointer; border-radius:var(--radius-sm);
    padding:12px 16px; font-weight:700; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-accent{ background:var(--accent); color:#3A2A05; }
  .btn-outline{ background:transparent; color:var(--primary); border:1.5px solid var(--primary); }
  .btn-danger-outline{ background:transparent; color:var(--danger); border:1.5px solid var(--danger); }
  .btn-ghost{ background:var(--primary-tint); color:var(--primary-dark); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:12.5px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .fab{
    position:fixed; z-index:15; right:calc(50% - 240px + 18px); bottom:96px;
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:#3A2A05;
    display:flex; align-items:center; justify-content:center; font-size:26px; border:none; cursor:pointer;
    box-shadow:0 8px 18px rgba(0,0,0,0.22);
  }
  @media (max-width:480px){ .fab{ right:18px; } }

  /* ---------- Bottom nav ---------- */
  #bottomnav{
    position:sticky; bottom:0; left:0; right:0; z-index:20;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 2px; cursor:pointer; color:var(--text-muted); font-family:var(--font);
  }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-btn span{ font-size:10.5px; font-weight:700; }
  .nav-btn.active{ color:var(--primary); }
  .nav-btn.active svg{ stroke:var(--primary); }

  /* ---------- Forms ---------- */
  label{ font-size:12.5px; font-weight:700; color:var(--text-muted); display:block; margin:14px 0 6px; }
  label:first-child{ margin-top:0; }
  input[type=text], input[type=number], input[type=tel], select, textarea{
    width:100%; font-family:var(--font); font-size:14.5px; padding:11px 12px; border-radius:var(--radius-sm);
    border:1.5px solid var(--border); background:var(--surface); color:var(--text);
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--primary); }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }
  .field-row-3{ display:flex; gap:8px; }
  .field-row-3 > div{ flex:1; min-width:0; }
  .field-row-3 input{ width:100%; box-sizing:border-box; }

  /* ---------- Search ---------- */
  .search-bar{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px; }
  .search-bar input{ border:none; padding:0; flex:1; }
  .search-bar input:focus{ outline:none; }

  /* ---------- Chips ---------- */
  .chip-row{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px; }
  .chip-row::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0; padding:8px 14px; border-radius:20px; background:var(--surface); border:1.5px solid var(--border);
    font-size:13px; font-weight:700; color:var(--text-muted); cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }

  /* ---------- Product grid (POS) ---------- */
  .product-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; }
  .product-card{
    background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md);
    padding:12px; cursor:pointer; text-align:left; position:relative; display:flex; flex-direction:column; gap:6px;
  }
  .product-card:active{ transform:scale(0.98); }
  .product-card .p-icon{ font-size:26px; width:48px; height:48px; border-radius:10px; overflow:hidden; background:var(--primary-tint); display:flex; align-items:center; justify-content:center; }
  .product-card .p-name{ font-size:13.5px; font-weight:700; line-height:1.25; min-height:34px; }
  .product-card .p-price{ font-size:14px; font-weight:800; color:var(--primary-dark); }
  .product-card .p-stock{ font-size:11px; color:var(--text-muted); }
  .product-card .p-stock.low{ color:var(--danger); font-weight:700; }
  .product-card.out{ opacity:.45; pointer-events:none; }
  .qty-badge{
    position:absolute; top:-8px; right:-8px; background:var(--accent); color:#3A2A05; font-weight:800; font-size:12px;
    min-width:22px; height:22px; border-radius:11px; display:flex; align-items:center; justify-content:center; padding:0 5px;
  }

  /* ---------- Product list (management) ---------- */
  .plist-item{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:11px 12px; margin-bottom:9px;
  }
  .plist-item .p-icon{ font-size:24px; width:38px; height:38px; background:var(--primary-tint); border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .plist-item .p-info{ flex:1; min-width:0; }
  .plist-item .p-info .name{ font-weight:700; font-size:14px; }
  .plist-item .p-info .meta{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .plist-item .p-actions{ display:flex; gap:6px; }
  .icon-btn{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted);
  }
  .icon-btn.danger{ color:var(--danger); border-color:#F3D3CE; }

  /* ---------- Empty state ---------- */
  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-muted); }
  .empty-state .emoji{ font-size:40px; margin-bottom:10px; }
  .empty-state .title{ font-weight:700; color:var(--text); margin-bottom:4px; }

  /* ---------- Cart bottom bar / sheet ---------- */
  #cart-bar{
    position:sticky; bottom:0; left:0; right:0; z-index:14; margin:0 -16px; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--primary-dark); color:#fff; display:none; align-items:center; justify-content:space-between; gap:12px;
    border-radius:16px 16px 0 0;
  }
  #cart-bar.show{ display:flex; }
  #cart-bar .cb-left{ font-size:12.5px; opacity:.85; }
  #cart-bar .cb-total{ font-size:17px; font-weight:800; }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(15,20,18,0.5); z-index:30; display:none; align-items:flex-end; justify-content:center;
  }
  .sheet-overlay.show{ display:flex; }
  .sheet{
    background:var(--surface); width:100%; max-width:480px; border-radius:22px 22px 0 0;
    max-height:88vh; overflow-y:auto; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    animation:sheetup .22s ease;
  }
  @keyframes sheetup{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:40px; height:4px; background:var(--border); border-radius:2px; margin:0 auto 14px; }
  .sheet-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .sheet-header h3{ font-size:16.5px; }
  .sheet-close{ background:var(--bg); border:none; width:30px; height:30px; border-radius:50%; cursor:pointer; color:var(--text-muted); font-size:16px; }

  .cart-line{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .cart-line:last-child{ border-bottom:none; }
  .cart-line .cl-icon{ font-size:20px; width:34px; height:34px; background:var(--primary-tint); border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .cart-line .cl-info{ flex:1; min-width:0; }
  .cart-line .cl-name{ font-size:13.5px; font-weight:700; }
  .cart-line .cl-price{ font-size:11.5px; color:var(--text-muted); }
  .tier-chips{ display:flex; gap:4px; margin-top:4px; }
  .tier-chip{ font-size:10px; padding:2px 8px; border-radius:20px; border:1px solid var(--border); cursor:pointer; color:var(--text-muted); background:var(--bg); }
  .cl-unit-select{ font-size:11px; padding:2px 4px; margin-top:4px; border-radius:6px; border:1px solid var(--border); color:var(--text-muted); max-width:110px; }
  .tier-chip.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .qty-stepper{ display:flex; align-items:center; gap:8px; }
  .qty-stepper button{ width:26px; height:26px; border-radius:7px; border:1px solid var(--border); background:var(--bg); cursor:pointer; font-weight:800; color:var(--primary); }
  .qty-stepper span{ min-width:18px; text-align:center; font-weight:700; font-size:13.5px; }

  .pay-methods{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
  .pay-btn{
    border:1.5px solid var(--border); background:var(--surface); border-radius:var(--radius-sm); padding:10px; text-align:center;
    cursor:pointer; font-size:12.5px; font-weight:700; color:var(--text-muted); display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .pay-btn .pe{ font-size:18px; }
  .pay-btn.active{ border-color:var(--primary); background:var(--primary-tint); color:var(--primary-dark); }

  .summary-row{ display:flex; justify-content:space-between; font-size:13.5px; margin:6px 0; }
  .summary-row.total{ font-size:17px; font-weight:800; margin-top:10px; padding-top:10px; border-top:1.5px dashed var(--border); }

  /* ---------- Receipt ---------- */
  .receipt{ font-family:'Manrope',sans-serif; color:#7a2e18; background:#eef2e2; padding:14px; border-radius:8px; }
  .receipt .rv-title{ text-align:center; font-weight:800; font-size:15px; line-height:1.4; }
  .receipt .rv-address{ text-align:center; font-size:11px; margin-top:4px; }
  .receipt .rv-phones{ text-align:center; font-size:11px; margin-top:2px; }
  .receipt .rv-meta{ margin-top:10px; font-size:11.5px; border-top:1px dashed #7a2e18; padding-top:8px; }
  .receipt .rv-meta div{ display:flex; justify-content:space-between; margin-bottom:3px; }
  .receipt table.rv-table{ width:100%; border-collapse:collapse; margin-top:10px; font-size:12px; }
  .receipt table.rv-table th, .receipt table.rv-table td{ border:1px solid #7a2e18; padding:4px 6px; }
  .receipt table.rv-table th{ font-size:11px; }
  .receipt table.rv-table td.num{ text-align:right; }
  .receipt .rv-total-row td{ font-weight:800; }
  .receipt .rv-footnote{ font-size:10px; margin-top:8px; line-height:1.5; }
  .receipt .rv-bottom{ display:flex; justify-content:space-between; margin-top:10px; font-size:11.5px; }

  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:100px; z-index:60; background:var(--primary-dark); color:#fff;
    padding:10px 18px; border-radius:30px; font-size:13px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.25);
    opacity:0; transition:opacity .25s, bottom .25s; pointer-events:none;
  }
  .toast.show{ opacity:1; bottom:112px; }

  .low-badge{ background:var(--danger-tint); color:var(--danger); font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:8px; }
  .table-simple{ width:100%; border-collapse:collapse; }
  .table-simple th{ text-align:left; font-size:11px; color:var(--text-muted); padding:0 0 6px; font-weight:700; }
  .table-simple td{ font-size:13px; padding:8px 0; border-top:1px solid var(--border); }

  .sale-item{
    display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:12px; margin-bottom:9px; cursor:pointer;
  }
  .sale-item .si-id{ font-weight:700; font-size:13.5px; }
  .sale-item .si-time{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .sale-item .si-total{ font-weight:800; color:var(--primary-dark); font-size:14.5px; }
  .pill{ font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:8px; background:var(--primary-tint); color:var(--primary-dark); }

  /* ---------- Onboarding ---------- */
  #onboarding{
    position:fixed; inset:0; background:var(--primary); color:#fff; z-index:100; display:flex; flex-direction:column;
    justify-content:center; padding:32px 26px; max-width:480px; margin:0 auto;
  }
  #onboarding .ob-mark{ width:64px; height:64px; border-radius:18px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--primary-dark); font-size:28px; margin-bottom:18px; }
  #onboarding h1{ font-size:26px; font-weight:800; }
  #onboarding p{ opacity:.85; font-size:14px; line-height:1.6; margin-top:8px; }
  #onboarding .ob-card{ background:rgba(255,255,255,0.08); border-radius:16px; padding:16px; margin-top:22px; }
  #onboarding input{ background:#fff; }
  #onboarding .ob-tabs{ display:flex; gap:8px; margin-bottom:14px; }
  #onboarding .ob-tab{ flex:1; text-align:center; padding:9px; border-radius:10px; background:rgba(255,255,255,0.08); cursor:pointer; font-weight:700; font-size:13px; }
  #onboarding .ob-tab.active{ background:var(--accent); color:var(--primary-dark); }
  #onboarding .ob-hint{ font-size:11.5px; opacity:.7; margin-top:10px; line-height:1.5; }

  .settings-item{ display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border); }
  .settings-item:last-child{ border-bottom:none; }
  .settings-item .si-label{ font-size:13.5px; font-weight:600; }
  .settings-item .si-sub{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .code-box{ display:flex; align-items:center; justify-content:space-between; background:var(--primary-tint); border-radius:var(--radius-sm); padding:12px 14px; margin-top:6px; }
  .code-box .code{ font-weight:800; font-size:17px; letter-spacing:2px; color:var(--primary-dark); }

  .loading-spin{ width:34px; height:34px; border-radius:50%; border:3px solid rgba(255,255,255,0.25); border-top-color:#fff; animation:spin .8s linear infinite; margin:0 auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- PIN lock ---------- */
  #pinlock{
    position:fixed; inset:0; background:var(--primary); color:#fff; z-index:90; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:32px 26px; max-width:480px; margin:0 auto;
  }
  #pinlock .pl-mark{ width:56px; height:56px; border-radius:16px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--primary-dark); font-size:24px; margin-bottom:14px; }
  #pinlock h2{ font-size:19px; font-weight:800; }
  #pinlock .pl-sub{ font-size:12.5px; opacity:.75; margin-top:4px; text-align:center; }
  #pinlock .pl-dots{ display:flex; gap:14px; margin:26px 0; }
  #pinlock .pl-dot{ width:14px; height:14px; border-radius:50%; border:2px solid rgba(255,255,255,0.5); }
  #pinlock .pl-dot.filled{ background:var(--accent); border-color:var(--accent); }
  #pinlock .pl-err{ color:#F3A29A; font-size:12.5px; height:16px; margin-bottom:10px; }
  #pinlock .pl-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; max-width:260px; }
  #pinlock .pl-key{
    aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,0.08); border:none; color:#fff;
    font-size:20px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #pinlock .pl-key:active{ background:rgba(255,255,255,0.2); }
  #pinlock .pl-key.empty{ background:transparent; cursor:default; }
  #pinlock .pl-staff-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:22px; max-width:300px; }

<script>
/* =========================================================
   HASAN POS — state, storage (cloud sync), and rendering
   ========================================================= */

const CUR = { symbol: 'Ks' };
const LOW_STOCK_THRESHOLD = 5;
const ICONS = ['🥤','☕','🍵','🍞','🍪','🧃','🍫','🧊','🍚','🥟','🍜','🧴','🧼','📒','🖊️','🔋','📦','🧺','🍬','🥫'];

/* Google Apps Script source the user deploys as a free key-value backend
   (backed by a Google Sheet) so the app can cloud-sync without Claude. */
const APPS_SCRIPT_CODE = `function getSheet_(){
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  return ss.getSheetByName('data') || ss.insertSheet('data');
}

function doGet(e){
  var key = e.parameter.key;
  var sheet = getSheet_();
  var data = sheet.getDataRange().getValues();
  for (var i=0;i<data.length;i++){
    if (data[i][0] === key){
      return ContentService.createTextOutput(data[i][1]).setMimeType(ContentService.MimeType.TEXT);
    }
  }
  return ContentService.createTextOutput('').setMimeType(ContentService.MimeType.TEXT);
}

function doPost(e){
  var body = JSON.parse(e.postData.contents);
  var action = body.action || 'set';
  var key = body.key;
  var sheet = getSheet_();
  var data = sheet.getDataRange().getValues();
  var rowIndex = -1;
  for (var i=0;i<data.length;i++){
    if (data[i][0] === key){ rowIndex = i+1; break; }
  }
  if (action === 'delete'){
    if (rowIndex > 0) sheet.deleteRow(rowIndex);
    return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
  }
  var value = body.value;
  if (rowIndex > 0){ sheet.getRange(rowIndex,2).setValue(value); }
  else { sheet.appendRow([key, value]); }
  return ContentService.createTextOutput(JSON.stringify({ok:true})).setMimeType(ContentService.MimeType.JSON);
}`;

let state = {
  shopCode: null,
  shopName: 'ဦးတင်အောင် ကုန်စုံဆိုင်',
  settings: { currency: 'Ks', shopName: 'ဦးတင်အောင် ကုန်စုံဆိုင်', address: 'အမှတ်(၁၂၇)၊ အနောက်မြို့ပတ်လမ်း၊ တိုက်ကြီးမြို့', shopPhones: '09 973581254, 09 5394454', homePhones: '09 5394168, 09 979095560, 09 783619223', archiveDays: 90 },
  products: [],
  sales: [],
  categories: ['အားလုံး'],
  costUnits: ['ပိသာ','ပြည်','အိတ်'],
  unitOptions: ['ခု','ပုလင်း','ထုပ်','ပါကင်','ဒါဇင်','ပိသာ','ပြည်','အိတ်'],
  debtBooks: [],      // {id, name, customers:[{id,name,phone,entries:[{id,date,amount,note,type}]}]}
  expenses: [],       // {id, date, amount, category, note}
  expenseCategories: ['ငှားရမ်းခ','လျှပ်စစ်','ဝန်ထမ်းလစာ','ကုန်ပစ္စည်းဝယ်ယူခ','သယ်ယူပို့ဆောင်ခ','အခြား'],
  cart: [],           // {id, name, price, qty, icon, unit}
  activeCategory: 'အားလုံး',
  activeScreen: 'dashboard',
  paymentMethod: 'cash',
  paymentType: 'cash',      // 'cash' | 'credit'
  checkoutCustomerName: '',
  checkoutCustomerPhone: '',
  checkoutDebtBookId: null,
  checkoutDebtCustomerId: null,
  discountPct: 0,
  syncStatus: 'idle',  // idle | syncing | ok | err
  lastSyncAt: null,
  staff: [],            // {id, name, pin}
  currentStaffId: null,  // session-only, not persisted
  archivedCount: 0,
};
let __pinBuffer = '';

/* ---------------- storage helpers ---------------- */
/* Three tiers, tried in order:
   1) Cloud Sync (window.storage) — only exists inside the Claude app/artifact context.
   2) Google Apps Script remote — a free Google Sheet acting as a tiny database,
      used when the app runs as a standalone downloaded file (outside Claude).
   3) localStorage — single-device fallback if neither of the above is set up. */
const CLOUD_AVAILABLE = (typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function');

function getRemoteUrl(){
  try{ return (localStorage.getItem('hasanpos:remoteApiUrl') || '').trim(); }catch(e){ return ''; }
}
function setRemoteUrlLocal(url){
  try{ localStorage.setItem('hasanpos:remoteApiUrl', (url||'').trim()); }catch(e){}
}
function syncMode(){
  if(FIREBASE_READY) return 'firebase';
  if(CLOUD_AVAILABLE) return 'cloud';
  if(getRemoteUrl()) return 'google';
  return 'local';
}

/* ---------------- Firebase (Firestore) tier ----------------
   Preferred backend for a busy shop: unlike the Google Sheet tier it
   handles two devices writing at once without one silently overwriting
   the other, keeps working while the internet is down (writes queue up
   and flush on reconnect), and can push changes to other devices live.
   Each stored key becomes one document under shops/<shopCode>/data. */
let FIREBASE_READY = false;
let __fsdb = null;
let __debtUnsub = null;

function getFirebaseConfig(){
  try{
    const raw = localStorage.getItem('hasanpos:firebaseConfig');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function setFirebaseConfigLocal(cfg){
  try{
    if(cfg) localStorage.setItem('hasanpos:firebaseConfig', JSON.stringify(cfg));
    else localStorage.removeItem('hasanpos:firebaseConfig');
  }catch(e){}
}

function initFirebase(){
  const cfg = getFirebaseConfig();
  if(!cfg || !cfg.projectId || typeof firebase === 'undefined') return false;
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    __fsdb = firebase.firestore();
    // Offline cache: the shop keeps selling through an internet outage and
    // everything written meanwhile is flushed automatically on reconnect.
    __fsdb.enablePersistence({ synchronizeTabs:true }).catch(()=>{});
    FIREBASE_READY = true;
    return true;
  }catch(e){
    console.error('hasanpos: firebase init failed', e);
    FIREBASE_READY = false;
    return false;
  }
}

function fsDoc(key){
  // Firestore document ids cannot contain "/", so the key is encoded.
  return __fsdb.collection('shops').doc(state.shopCode || 'unknown')
               .collection('data').doc(encodeURIComponent(key));
}
async function firebaseGet(key){
  try{
    const snap = await fsDoc(key).get();
    return snap.exists ? (snap.data().value ?? null) : null;
  }catch(e){ return null; }
}
async function firebaseSet(key, value){
  try{
    await fsDoc(key).set({ value, updatedAt: Date.now() });
    return { key, value };
  }catch(e){ return null; }
}
async function firebaseDelete(key){
  try{
    await fsDoc(key).delete();
    return { key, deleted:true };
  }catch(e){ return null; }
}

/* Native Firestore collections — one real document per product/sale/debt
   book, instead of one big JSON blob for the whole list. This is what
   makes individual saves fast: adding one sale writes ONE small document,
   not the entire sales history; editing one product's stock touches only
   that product's document, not all of them. */
function fsRecordCollection(name){
  return __fsdb.collection('shops').doc(state.shopCode || 'unknown').collection(name);
}
async function firebaseSaveRecord(collectionName, id, data){
  try{ await fsRecordCollection(collectionName).doc(String(id)).set(data); return true; }
  catch(e){ return false; }
}
async function firebaseDeleteRecord(collectionName, id){
  try{ await fsRecordCollection(collectionName).doc(String(id)).delete(); return true; }
  catch(e){ return false; }
}
async function firebaseLoadCollection(collectionName){
  try{
    const snap = await fsRecordCollection(collectionName).get();
    return snap.docs.map(d => d.data());
  }catch(e){ return null; }
}

async function remoteGet(key){
  const url = getRemoteUrl();
  if(!url) return null;
  try{
    const res = await fetch(url + '?key=' + encodeURIComponent(key), { method:'GET' });
    if(!res.ok) return null;
    const text = await res.text();
    return text ? text : null;
  }catch(e){ return null; }
}
async function remoteSet(key, value){
  const url = getRemoteUrl();
  if(!url) return null;
  try{
    const res = await fetch(url, {
      method:'POST',
      headers: { 'Content-Type':'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script
      body: JSON.stringify({ action:'set', key, value }),
    });
    if(!res.ok) return null;
    return { key, value };
  }catch(e){ return null; }
}
async function remoteDelete(key){
  const url = getRemoteUrl();
  if(!url) return null;
  try{
    await fetch(url, {
      method:'POST',
      headers: { 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'delete', key }),
    });
    return { key, deleted:true };
  }catch(e){ return null; }
}

async function rawStoreGet(key){
  if(FIREBASE_READY){
    const v = await firebaseGet(key);
    if(v !== null){ try{ localStorage.setItem(key, v); }catch(e){} return v; }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  if(CLOUD_AVAILABLE){
    try{ const r = await window.storage.get(key, true); return r ? r.value : null; }catch(e){ return null; }
  }
  if(getRemoteUrl()){
    const v = await remoteGet(key);
    if(v !== null){ try{ localStorage.setItem(key, v); }catch(e){} }
    else { try{ return localStorage.getItem(key); }catch(e){ return null; } } // offline fallback to last-known copy
    return v;
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function rawStoreSet(key, value){
  if(FIREBASE_READY){
    try{ localStorage.setItem(key, value); }catch(e){}
    return await firebaseSet(key, value);
  }
  if(CLOUD_AVAILABLE){
    try{ return await window.storage.set(key, value, true); }catch(e){ return null; }
  }
  if(getRemoteUrl()){
    try{ localStorage.setItem(key, value); }catch(e){}
    return await remoteSet(key, value);
  }
  try{ localStorage.setItem(key, value); return { key, value }; }catch(e){ return null; }
}
async function rawStoreDelete(key){
  if(FIREBASE_READY){
    try{ localStorage.removeItem(key); }catch(e){}
    return await firebaseDelete(key);
  }
  if(CLOUD_AVAILABLE){
    try{ return await window.storage.delete(key, true); }catch(e){ return null; }
  }
  if(getRemoteUrl()){
    try{ localStorage.removeItem(key); }catch(e){}
    return await remoteDelete(key);
  }
  try{ localStorage.removeItem(key); return { key, deleted:true }; }catch(e){ return null; }
}
/* device-local key (shop code remembered on this device) never needs cloud sharing */
async function deviceStoreGet(key){
  if(CLOUD_AVAILABLE){
    try{ const r = await window.storage.get(key, false); return r ? r.value : null; }catch(e){ return null; }
  }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function deviceStoreSet(key, value){
  if(CLOUD_AVAILABLE){
    try{ return await window.storage.set(key, value, false); }catch(e){ return null; }
  }
  try{ localStorage.setItem(key, value); return { key, value }; }catch(e){ return null; }
}
async function deviceStoreDelete(key){
  if(CLOUD_AVAILABLE){
    try{ return await window.storage.delete(key, false); }catch(e){ return null; }
  }
  try{ localStorage.removeItem(key); return { key, deleted:true }; }catch(e){ return null; }
}

function skey(name){ return `hasanpos:${state.shopCode}:${name}`; }

async function storageGetSafe(key){
  return await rawStoreGet(key);
}

/* Google Sheets caps a single cell at ~50,000 characters. A large list
   (hundreds of products, or many debt-book entries) can easily produce a
   JSON string longer than that, which makes the cloud save silently fail
   (Apps Script returns a 200 error page, so the app has no way to notice).
   To avoid this, any such list is split into fixed-size chunks that are
   each well under the limit and stored under separate keys, plus a small
   "meta" key that records how many chunks exist. */
const STORAGE_CHUNK_SIZE = 150;

async function saveChunkedList(baseKey, list){
  const chunks = [];
  for(let i=0;i<list.length;i+=STORAGE_CHUNK_SIZE){
    chunks.push(list.slice(i, i+STORAGE_CHUNK_SIZE));
  }
  if(chunks.length === 0) chunks.push([]); // always keep at least one (empty) chunk

  const metaRaw = await storageGetSafe(skey(`${baseKey}:meta`));
  const meta = safeParse(metaRaw, { count: 0 });
  const oldCount = Number(meta.count) || 0;

  await Promise.all(chunks.map((c, i) => rawStoreSet(skey(`${baseKey}:chunk:${i}`), JSON.stringify(c))));
  await rawStoreSet(skey(`${baseKey}:meta`), JSON.stringify({ count: chunks.length }));

  if(oldCount > chunks.length){
    const removals = [];
    for(let i=chunks.length;i<oldCount;i++) removals.push(rawStoreDelete(skey(`${baseKey}:chunk:${i}`)));
    await Promise.all(removals);
  }
}

async function loadChunkedList(baseKey, legacyKey){
  const metaRaw = await storageGetSafe(skey(`${baseKey}:meta`));
  const meta = safeParse(metaRaw, null);

  if(meta && Number(meta.count) > 0){
    const count = Number(meta.count);
    const chunkRaws = await Promise.all(
      Array.from({length: count}, (_, i) => storageGetSafe(skey(`${baseKey}:chunk:${i}`)))
    );
    let combined = [];
    chunkRaws.forEach(raw => { combined = combined.concat(safeParse(raw, [])); });
    return combined;
  }

  if(legacyKey){
    const legacyRaw = await storageGetSafe(skey(legacyKey));
    if(legacyRaw){
      const legacy = safeParse(legacyRaw, null);
      if(legacy) return legacy;
    }
  }
  return null; // caller decides the fallback (existing list vs empty)
}

/* Older versions stored cost as three separate fixed fields (per-viss,
   per-pyi, per-bag). This folds any of those into the new single
   costUnit/costValue pair so existing product data keeps working. */
function migrateLegacyCostFields(){
  state.products.forEach(p => {
    if(p.costUnit) return; // already on the new schema
    if(p.costViss){ p.costUnit = 'ပိသာ'; p.costValue = p.costViss; }
    else if(p.costPyi){ p.costUnit = 'ပြည်'; p.costValue = p.costPyi; }
    else if(p.costBag){ p.costUnit = 'အိတ်'; p.costValue = p.costBag; }
  });
}

async function saveProducts(){
  if(FIREBASE_READY){
    // Bulk path (CSV import, reset, first-time migration) — every product
    // as its own document, all written in parallel.
    await Promise.all(state.products.map(p => firebaseSaveRecord('products', p.id, p)));
    return;
  }
  await saveChunkedList('products', state.products);
  await rawStoreDelete(skey('products')); // clean up the old single-blob key from before this fix
}
/* Fast path for the common case — one product changed, not the whole
   catalog — used by the product edit form and by checkout's stock update. */
async function saveProductRecords(products){
  if(FIREBASE_READY){
    await Promise.all(products.map(p => firebaseSaveRecord('products', p.id, p)));
    return;
  }
  await saveProducts(); // other tiers have no cheaper partial-save option
}
async function deleteProductRecord(id){
  if(FIREBASE_READY){ await firebaseDeleteRecord('products', id); return; }
  await saveProducts();
}
async function loadProductsFromStorage(){
  if(FIREBASE_READY){
    const list = await firebaseLoadCollection('products');
    if(list && list.length) return list;
    // Not migrated to the per-document scheme yet — try the old chunked
    // blob (from before this update) and, if found, migrate it now so
    // future saves are fast from here on.
    const legacy = await loadChunkedList('products', 'products');
    if(legacy && legacy.length) await Promise.all(legacy.map(p => firebaseSaveRecord('products', p.id, p)));
    return legacy;
  }
  return await loadChunkedList('products', 'products');
}

async function saveDebtBooks(){
  if(FIREBASE_READY){
    await Promise.all(state.debtBooks.map(b => firebaseSaveRecord('debtBooks', b.id, b)));
    return;
  }
  await saveChunkedList('debtBooks', state.debtBooks);
}
/* Fast path — saving one book (e.g. after a single payment entry) instead
   of rewriting every debt book in the shop. */
async function saveDebtBookRecord(book){
  if(FIREBASE_READY){ await firebaseSaveRecord('debtBooks', book.id, book); return; }
  await saveDebtBooks();
}
async function deleteDebtBookRecord(id){
  if(FIREBASE_READY){ await firebaseDeleteRecord('debtBooks', id); return; }
  await saveDebtBooks();
}
async function loadDebtBooksFromStorage(){
  if(FIREBASE_READY){
    const list = await firebaseLoadCollection('debtBooks');
    if(list && list.length) return list;
    const legacy = await loadChunkedList('debtBooks', null);
    if(legacy && legacy.length) await Promise.all(legacy.map(b => firebaseSaveRecord('debtBooks', b.id, b)));
    return legacy;
  }
  return await loadChunkedList('debtBooks', null);
}

async function saveExpenseRecord(expense){
  if(FIREBASE_READY){ await firebaseSaveRecord('expenses', expense.id, expense); return; }
  await saveChunkedList('expenses', state.expenses);
}
async function deleteExpenseRecord(id){
  if(FIREBASE_READY){ await firebaseDeleteRecord('expenses', id); return; }
  await saveChunkedList('expenses', state.expenses);
}
async function loadExpensesFromStorage(){
  if(FIREBASE_READY){
    const list = await firebaseLoadCollection('expenses');
    if(list && list.length) return list;
    const legacy = await loadChunkedList('expenses', null);
    if(legacy && legacy.length) await Promise.all(legacy.map(x => firebaseSaveRecord('expenses', x.id, x)));
    return legacy;
  }
  return await loadChunkedList('expenses', null);
}
async function saveExpenseCategories(){
  await rawStoreSet(skey('expenseCategories'), JSON.stringify(state.expenseCategories));
}

async function saveSales(){
  if(FIREBASE_READY){
    await Promise.all(state.sales.map(s => firebaseSaveRecord('sales', s.id, s)));
    return;
  }
  await rawStoreSet(skey('sales'), JSON.stringify(state.sales));
}
/* Fast path — a checkout only ever adds ONE new sale, so only that one
   document needs writing instead of the entire (ever-growing) history. */
async function saveSaleRecord(sale){
  if(FIREBASE_READY){ await firebaseSaveRecord('sales', sale.id, sale); return; }
  await saveSales();
}
async function deleteSaleRecord(id){
  if(FIREBASE_READY){ await firebaseDeleteRecord('sales', id); return; }
  await saveSales();
}
async function loadSalesFromStorage(){
  if(FIREBASE_READY){
    const list = await firebaseLoadCollection('sales');
    if(list && list.length) return list;
    const legacyRaw = await storageGetSafe(skey('sales'));
    const legacy = safeParse(legacyRaw, null);
    if(legacy && legacy.length) await Promise.all(legacy.map(s => firebaseSaveRecord('sales', s.id, s)));
    return legacy;
  }
  return safeParse(await storageGetSafe(skey('sales')), null);
}
async function saveSettings(){
  await rawStoreSet(skey('settings'), JSON.stringify(state.settings));
}
async function saveCategories(){
  await rawStoreSet(skey('categories'), JSON.stringify(state.categories));
}
async function saveCostUnits(){
  await rawStoreSet(skey('costUnits'), JSON.stringify(state.costUnits));
}
async function saveUnitOptions(){
  await rawStoreSet(skey('unitOptions'), JSON.stringify(state.unitOptions));
}
async function saveStaff(){
  await rawStoreSet(skey('staff'), JSON.stringify(state.staff));
}

/* ---------------- auto-archive old sales ---------------- */
async function runArchiveCheck(){
  const days = Number(state.settings.archiveDays) || 90;
  const cutoff = Date.now() - days*86400000;
  const raw = await storageGetSafe(skey('sales_archive'));
  let archive = safeParse(raw, []);
  const oldOnes = state.sales.filter(s => s.time < cutoff);
  if(oldOnes.length > 0){
    archive = archive.concat(oldOnes);
    state.sales = state.sales.filter(s => s.time >= cutoff);
    await Promise.all([
      rawStoreSet(skey('sales_archive'), JSON.stringify(archive)),
      FIREBASE_READY ? Promise.all(oldOnes.map(s => deleteSaleRecord(s.id))) : saveSales(),
    ]);
  }
  state.archivedCount = archive.length;
}

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

/* Parses stored JSON safely. If a value ever gets corrupted/truncated (e.g. a
   browser storage quota hiccup), this stops the app from getting permanently
   stuck — it just falls back to a safe default for that one piece of data
   instead of throwing and freezing the whole app on every future load. */
function safeParse(raw, fallback){
  if(raw === null || raw === undefined || raw === '') return fallback;
  try{ return JSON.parse(raw); }catch(e){ console.warn('hasanpos: corrupted data recovered with fallback', e); return fallback; }
}

/* ---------------- load / sync ---------------- */
async function loadShop(code, {seedIfEmpty=false} = {}){
  // Belt-and-braces: the onboarding screen only gets hidden inside the
  // create/join success handlers, so a returning device (which skips
  // straight to loadShop with an already-saved shop code) would otherwise
  // leave that full-screen overlay sitting on top of the real app for the
  // whole time this function is loading data.
  const ob = document.getElementById('onboarding');
  if(ob) ob.style.display = 'none';
  state.shopCode = code;
  setSyncStatus('syncing');
  const [pList, sList, setRaw, catRaw, cuRaw, stRaw, dbList, uoRaw, exList, ecRaw] = await Promise.all([
    loadProductsFromStorage(),
    loadSalesFromStorage(),
    storageGetSafe(skey('settings')),
    storageGetSafe(skey('categories')),
    storageGetSafe(skey('costUnits')),
    storageGetSafe(skey('staff')),
    loadDebtBooksFromStorage(),
    storageGetSafe(skey('unitOptions')),
    loadExpensesFromStorage(),
    storageGetSafe(skey('expenseCategories')),
  ]);

  state.products = pList || [];
  migrateLegacyCostFields();
  state.sales = sList || [];
  state.categories = safeParse(catRaw, ['အားလုံး']);
  state.costUnits = safeParse(cuRaw, ['ပိသာ','ပြည်','အိတ်']);
  state.unitOptions = safeParse(uoRaw, ['ခု','ပုလင်း','ထုပ်','ပါကင်','ဒါဇင်','ပိသာ','ပြည်','အိတ်']);
  state.settings = safeParse(setRaw, { currency:'Ks', shopName:'ဦးတင်အောင် ကုန်စုံဆိုင်', address:'အမှတ်(၁၂၇)၊ အနောက်မြို့ပတ်လမ်း၊ တိုက်ကြီးမြို့', shopPhones:'09 973581254, 09 5394454', homePhones:'09 5394168, 09 979095560, 09 783619223' });
  state.staff = safeParse(stRaw, []);
  state.debtBooks = dbList || [];
  state.expenses = exList || [];
  state.expenseCategories = safeParse(ecRaw, ['ငှားရမ်းခ','လျှပ်စစ်','ဝန်ထမ်းလစာ','ကုန်ပစ္စည်းဝယ်ယူခ','သယ်ယူပို့ဆောင်ခ','အခြား']);

  if(!pList && seedIfEmpty){
    seedDemoData();
    await Promise.all([saveProducts(), saveSales(), saveSettings(), saveCategories()]);
  }

  await runArchiveCheck();

  try{ await deviceStoreSet('device:shopCode', code); }catch(e){}

  state.activeCategory = state.categories[0] || 'အားလုံး';
  startDebtRealtimeSync();
  setSyncStatus('ok');
  renderTopbar();

  if(state.staff.length > 0){
    renderPinLock();
  } else {
    state.currentStaffId = null;
    renderScreen();
  }
}

async function manualSync(silent){
  if(!state.shopCode) return;
  setSyncStatus('syncing');
  const [pList, sList, setRaw, catRaw, cuRaw, stRaw, dbList, uoRaw, exList, ecRaw] = await Promise.all([
    loadProductsFromStorage(),
    loadSalesFromStorage(),
    storageGetSafe(skey('settings')),
    storageGetSafe(skey('categories')),
    storageGetSafe(skey('costUnits')),
    storageGetSafe(skey('staff')),
    loadDebtBooksFromStorage(),
    storageGetSafe(skey('unitOptions')),
    loadExpensesFromStorage(),
    storageGetSafe(skey('expenseCategories')),
  ]);
  if(pList){ state.products = pList; migrateLegacyCostFields(); }
  if(sList) state.sales = sList;
  if(setRaw) state.settings = safeParse(setRaw, state.settings);
  if(catRaw) state.categories = safeParse(catRaw, state.categories);
  if(cuRaw) state.costUnits = safeParse(cuRaw, state.costUnits);
  if(uoRaw) state.unitOptions = safeParse(uoRaw, state.unitOptions);
  if(stRaw) state.staff = safeParse(stRaw, state.staff);
  if(dbList) state.debtBooks = dbList;
  if(exList) state.expenses = exList;
  if(ecRaw) state.expenseCategories = safeParse(ecRaw, state.expenseCategories);
  await runArchiveCheck();
  setSyncStatus('ok');
  renderTopbar();
  renderScreen();
  if(!silent) showToast('ဒေတာအသစ် sync ပြီးပါပြီ');
}

function setSyncStatus(s){
  state.syncStatus = s;
  if(s === 'ok') state.lastSyncAt = new Date();
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if(!dot) return;
  dot.className = '';
  const mode = syncMode();
  if(s === 'syncing'){ dot.classList.add('syncing'); label.textContent = mode==='local' ? 'သိမ်းနေ…' : 'Syncing…'; }
  else if(s === 'err'){ dot.classList.add('err'); label.textContent = 'Sync error'; }
  else {
    label.textContent = mode==='firebase' ? 'Live Sync' : mode==='cloud' ? 'Synced' : mode==='google' ? 'Google Synced' : 'Device Only';
  }
}

/* ---------------- onboarding ---------------- */
/* Real-time debt sync: Firestore pushes any change made on another device
   straight to this one, so the credit ledger is never stale. Only applied
   while the person isn't mid-entry (no open sheet, empty cart) so it can't
   yank data out from under them. */
function startDebtRealtimeSync(){
  if(!FIREBASE_READY || !state.shopCode) return;
  if(__debtUnsub){ try{ __debtUnsub(); }catch(e){} __debtUnsub = null; }
  try{
    __debtUnsub = fsRecordCollection('debtBooks').onSnapshot(snap => {
      const overlay = document.getElementById('sheet-overlay');
      if(overlay && overlay.classList.contains('show')) return;
      if(state.cart.length > 0) return;
      state.debtBooks = snap.docs.map(d => d.data());
      if(state.activeScreen==='settings') renderScreen();
    }, () => {});
  }catch(e){}
}

async function initApp(){
  initFirebase();
  try{
    const existing = await deviceStoreGet('device:shopCode');
    if(existing){
      await loadShop(existing);
    } else {
      renderOnboarding();
    }
  }catch(err){
    console.error('hasanpos: failed to start app', err);
    renderStartupError();
  }
  startBackgroundSync();
}

/* Debt data involves real money, so instead of relying only on whatever
   was last pulled, we quietly re-sync every so often while the app sits
   open — and skip it while a sheet is open or the cart has items, so it
   never overwrites something the person is in the middle of entering. */
function startBackgroundSync(){
  setInterval(async () => {
    if(!state.shopCode || syncMode() === 'local') return;
    const overlay = document.getElementById('sheet-overlay');
    if(overlay && overlay.classList.contains('show')) return;
    if(state.cart.length > 0) return;
    try{ await manualSync(true); }catch(e){}
  }, 30000);
}

/* Called right before any debt-book write so a second device's changes
   (another sale, another payment) aren't silently overwritten by this
   device saving its own copy of the whole list. */
async function refreshDebtBooksBeforeWrite(){

    const fresh = await loadDebtBooksFromStorage();
    if(fresh) state.debtBooks = fresh;
  }catch(e){}

async function recoverFromStartupError(){
  if(!confirm('ဒီ device ပေါ်ရှိ Hasan POS ဒေတာအားလုံး ဖျက်ပြီး အသစ်ပြန်စမှာသေချာပါသလား?')) return;
  try{
    // Clear only this app's own keys (namespaced "hasanpos:") plus the device shop-code pointer.
    for(let i = localStorage.length - 1; i >= 0; i--){
      const k = localStorage.key(i);
      if(k && k.startsWith('hasanpos:')) localStorage.removeItem(k);
    }
    await deviceStoreDelete('device:shopCode');
  }catch(e){}
  location.reload();
}

function genShopCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

/* ---------------- PIN lock ---------------- */
function renderPinLock(errMsg){
  __pinBuffer = '';
  const el = document.getElementById('pinlock');
  el.style.display = 'flex';
  const keys = [1,2,3,4,5,6,7,8,9,'',0,'back'];
  el.innerHTML = `
    <div class="pl-mark">🔒</div>
    <h2>PIN ဖြင့် ဝင်ရောက်ပါ</h2>
    <div class="pl-sub">${state.settings.shopName || 'Hasan POS'} — ဝန်ထမ်း PIN ၄ လုံး ထည့်ပါ</div>
    <div class="pl-dots" id="pl-dots">${[0,1,2,3].map(()=>'<div class="pl-dot"></div>').join('')}</div>
    <div class="pl-err" id="pl-err">${errMsg || ''}</div>
    <div class="pl-pad">
      ${keys.map(k => {
        if(k === '') return `<div class="pl-key empty"></div>`;
        if(k === 'back') return `<button class="pl-key" onclick="pinBackspace()">⌫</button>`;
        return `<button class="pl-key" onclick="pinPress(${k})">${k}</button>`;
      }).join('')}
    </div>
    <div class="pl-staff-row">
      ${state.staff.map(s => `<div class="pl-staff-chip">${s.name}</div>`).join('')}
    </div>
  `;
}
function pinPress(d){
  if(__pinBuffer.length >= 4) return;
  __pinBuffer += String(d);
  updatePinDots();
  if(__pinBuffer.length === 4) setTimeout(tryUnlockPin, 120);
}
function pinBackspace(){
  __pinBuffer = __pinBuffer.slice(0,-1);
  updatePinDots();
}
function updatePinDots(){
  const dots = document.querySelectorAll('#pl-dots .pl-dot');
  dots.forEach((d,i) => d.classList.toggle('filled', i < __pinBuffer.length));
}
function tryUnlockPin(){
  const match = state.staff.find(s => s.pin === __pinBuffer);
  if(match){
    state.currentStaffId = match.id;
    document.getElementById('pinlock').style.display = 'none';
    renderTopbar();
    renderScreen();
    showToast('ကြိုဆိုပါတယ်၊ ' + match.name);
  } else {
    document.getElementById('pl-err').textContent = 'PIN မှားနေပါသည်၊ ပြန်စမ်းကြည့်ပါ';
    __pinBuffer = '';
    updatePinDots();
  }
}
function currentStaffName(){
  const s = state.staff.find(x => x.id === state.currentStaffId);
  return s ? s.name : (state.staff.length === 0 ? '' : '—');
}

function lockNow(){
  if(state.staff.length === 0){ showToast('ပထမဆုံး Settings တွင် ဝန်ထမ်း ထည့်ပါ'); return; }
  state.currentStaffId = null;
  renderPinLock();
}

/* Guards a sensitive action (deleting a debt record, etc.) behind the
   owner's PIN. If no staff are set up at all, there's only one person
   using the app anyway, so the check is skipped entirely. If staff exist
   but none is marked as owner, the currently logged-in staff's own PIN is
   accepted (so a one-person "staff list" used only for sales attribution
   doesn't lock the owner out of their own data). */
function requireOwnerPin(actionLabel){
  if(state.staff.length === 0) return true;
  const owners = state.staff.filter(s => s.isOwner);
  const checkAgainst = owners.length > 0 ? owners : state.staff;
  const entered = prompt(`${actionLabel} — ဆိုင်ပိုင်ရှင် PIN ထည့်ပါ`);
  if(entered === null) return false;
  const match = checkAgainst.find(s => s.pin === entered.trim());
  if(!match){ showToast('PIN မှားနေပါသည် — ခွင့်မပြုနိုင်ပါ'); return false; }
  return true;
}

  document.getElementById('tb-shop-sub').textContent = 'ဆိုင်ကုဒ်: ' + (state.shopCode || '—');

function renderScreen(){
  const el = document.getElementById('screen');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.screen === state.activeScreen));
  if(state.activeScreen === 'dashboard') el.innerHTML = renderDashboard();
  else if(state.activeScreen === 'pos') { el.innerHTML = renderPOS(); renderCartBar(); }
  else if(state.activeScreen === 'products') el.innerHTML = renderProducts();
  else if(state.activeScreen === 'reports') { el.innerHTML = renderReports(); setTimeout(drawChart, 30); }
  else if(state.activeScreen === 'settings') el.innerHTML = renderSettings();
}

function fmt(n){
  n = Math.round(n);
  return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function money(n){ return fmt(n) + ' ' + (state.settings.currency || 'Ks'); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function isSameDay(ts, d){
  const a = new Date(ts), b = d;
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}

  q = q.trim().toLowerCase();
  const sorted = [...state.sales].sort((a,b) => b.time - a.time).slice(0, 200);
  const filtered = !q ? sorted : sorted.filter(s =>
    s.id.slice(-5).toLowerCase().includes(q) ||
    (s.customer && s.customer.name && s.customer.name.toLowerCase().includes(q))
  );

    filtered.length === 0 ? emptyState('🔍','ရှာမတွေ့ပါ','') : filtered.map(s => saleRowHTML(s)).join('');

/* ---------------- export / backup ---------------- */
function dateStamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function csvEscape(v){
  v = String(v === null || v === undefined ? '' : v);
  if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}
function toCSV(header, rows){
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r => lines.push(r.map(csvEscape).join(',')));
  return '\uFEFF' + lines.join('\n'); // BOM so Excel shows Myanmar text correctly
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

/* ---------------- bulk import (CSV) ---------------- */
function parseCSVLine(line){
  const result = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQuotes){
      if(c === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
      } else cur += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ result.push(cur); cur = ''; }
      else cur += c;
    }
  }
  result.push(cur);
  return result.map(s => s.trim());
}
function parseImportCSV(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if(lines.length === 0) return [];
  let startIdx = 0;
  const firstCells = parseCSVLine(lines[0]).map(c => c.toLowerCase());
  if(firstCells.some(c => c.includes('name') || c.includes('အမည်') || c.includes('price') || c.includes('ဈေး'))){
    startIdx = 1;
  }
  const items = [];
  for(let i=startIdx;i<lines.length;i++){
    const cells = parseCSVLine(lines[i]);
    const name = (cells[0]||'').trim();
    if(!name) continue;
    const category = (cells[1]||'').trim() || 'အထွေထွေ';
    const price = Number(String(cells[2]||'0').replace(/[,\s]/g,'')) || 0;
    const stock = Number(String(cells[3]||'0').replace(/[,\s]/g,'')) || 0;
    // optional extra columns (all backward-compatible — older 4/5-column CSVs still work)
    const priceWholesale = Number(String(cells[5]||'0').replace(/[,\s]/g,'')) || 0;
    const priceVIP = Number(String(cells[6]||'0').replace(/[,\s]/g,'')) || 0;
    const costUnit = (cells[7]||'').trim();
    const costValue = Number(String(cells[8]||'0').replace(/[,\s]/g,'')) || 0;
    const unit = (cells[9]||'').trim();
    const barcode = (cells[10]||'').trim();
    items.push({ name, category, price, stock, priceWholesale, priceVIP, costUnit, costValue, unit, barcode });
  }
  return items;
}

async function processImport(){
  const text = document.getElementById('import-textarea').value;
  const errEl = document.getElementById('import-err');
  const items = parseImportCSV(text);
  if(items.length === 0){ errEl.textContent = 'CSV ဒေတာ မတွေ့ပါ — format ကို စစ်ဆေးပါ'; return; }

  let added = 0, updated = 0;
  items.forEach(it => {
    if(!state.categories.includes(it.category)) state.categories.push(it.category);
    if(it.costUnit && !state.costUnits.includes(it.costUnit)) state.costUnits.push(it.costUnit);
    const existing = state.products.find(p => p.name.trim().toLowerCase() === it.name.toLowerCase());
    if(existing){
      existing.category = it.category;
      existing.price = it.price;
      existing.stock = it.stock;
      if(it.priceWholesale) existing.priceWholesale = it.priceWholesale;
      if(it.priceVIP) existing.priceVIP = it.priceVIP;
      if(it.costUnit) existing.costUnit = it.costUnit;
      if(it.costValue) existing.costValue = it.costValue;
      if(it.unit) existing.unit = it.unit;
      if(it.barcode) existing.barcode = it.barcode;
      updated++;
    } else {
      state.products.push({
        id: uid(), name: it.name, category: it.category, price: it.price, stock: it.stock,
        priceWholesale: it.priceWholesale, priceVIP: it.priceVIP,
        costUnit: it.costUnit, costValue: it.costValue, unit: it.unit || 'ခု', barcode: it.barcode || '',
      });
      added++;
    }
  });

  setSyncStatus('syncing');
  await Promise.all([saveProducts(), saveCategories(), saveCostUnits()]);
  setSyncStatus('ok');
  closeSheet();
  renderScreen();
  showToast(`Import ပြီးပါပြီ — အသစ် ${added} ခု၊ update ${updated} ခု`);
}

let __html5Qr = null;
function openBarcodeScanner(onResult){
  if(typeof Html5Qrcode === 'undefined'){ showToast('Scanner library မတင်ရသေးပါ — network ချိတ်ဆက်မှု စစ်ပြီး ထပ်စမ်းပါ'); return; }
  document.getElementById('sheet-content').innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-header"><h3>📷 Barcode Scan</h3><button class="sheet-close" onclick="closeSheet()">✕</button></div>
    <div id="barcode-reader" style="width:100%; border-radius:12px; overflow:hidden; background:#000;"></div>
    <div class="si-sub" style="margin-top:10px; text-align:center;">Barcode ကို frame အတွင်း ရောက်အောင် ကိုင်ထားပါ</div>
  `;
  document.getElementById('sheet-overlay').classList.add('show');
  window.__barcodeCallback = onResult;

  __html5Qr = new Html5Qrcode('barcode-reader');
  __html5Qr.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText) => {
      const cb = window.__barcodeCallback;
      closeSheet();
      if(cb) cb(decodedText);
    },
    () => {} // per-frame "nothing found yet" — normal while aiming, not an error
  ).catch(() => {
    showToast('Camera ဖွင့်၍မရပါ — camera ခွင့်ပြုချက် ပေးထားရဲ့လား စစ်ပါ');
    closeSheet();
  });
}
function stopBarcodeScanner(){
  if(__html5Qr){
    const q = __html5Qr;
    __html5Qr = null;
    q.stop().then(() => q.clear()).catch(() => {});
  }
}

function scanBarcodeForCart(){
  openBarcodeScanner((code) => {
    const p = state.products.find(x => x.barcode && x.barcode === code);
    if(p){
      addToCart(p.id);
      showToast(`${p.name} ထည့်ပြီးပါပြီ`);
    } else {
      if(confirm(`ဒီ barcode (${code}) နှင့် ကုန်ပစ္စည်း မတွေ့ပါ — ကုန်ပစ္စည်းအသစ် ထည့်မှာလား?`)){
        openProductForm();
        setTimeout(() => { const el = document.getElementById('pf-barcode'); if(el) el.value = code; }, 50);
      }
    }
  });
}

/* Sorts product names alphabetically the way a Myanmar reader expects
   (က, ခ, ဂ ... order), while still sorting English/Latin names sensibly
   too — used everywhere a product list is shown. */
function sortProductsByName(list){
  return [...list].sort((a, b) => a.name.localeCompare(b.name, 'my'));
}

function productCardHTML(p){
  const inCart = state.cart.find(c => c.id === p.id);
  const out = p.stock <= 0;
  return `
    <div class="product-card ${out?'out':''}" onclick="addToCart('${p.id}')">
      ${ inCart ? `<div class="qty-badge">${inCart.qty}</div>` : '' }
      <div class="p-icon">${p.photo ? `<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">` : '📦'}</div>
      <div class="p-name">${p.name}</div>
      <div class="p-price">${money(p.price)}</div>
      <div class="p-stock ${p.stock<=LOW_STOCK_THRESHOLD?'low':''}">${out?'ကုန်သွားပြီ':'လက်ကျန် '+p.stock+' '+(p.unit||'')}</div>
    </div>
  `;
}

function filterPOSSearch(q){
  q = q.trim().toLowerCase();
  const filtered = sortProductsByName(state.products.filter(p =>
    (state.activeCategory==='အားလုံး' || p.category === state.activeCategory) &&
    p.name.toLowerCase().includes(q) || (p.barcode && p.barcode.toLowerCase().includes(q))
  ));
  document.getElementById('pos-grid').innerHTML = filtered.length===0
    ? emptyState('🔍','ရှာမတွေ့ပါ','အမည်တခြားစမ်းကြည့်ပါ')
    : filtered.map(p => productCardHTML(p)).join('');
}

function setCategory(c){
  state.activeCategory = c;
  renderScreen();
}

function addToCart(id){
  const p = state.products.find(x => x.id === id);
  if(!p || p.stock <= 0) return;
  const line = state.cart.find(c => c.id === id);
  if(line){
    if(line.qty >= p.stock){ showToast('ကုန်ပစ္စည်း လက်ကျန်မလုံလောက်ပါ'); return; }
    line.qty++;
  } else {
    state.cart.push({ id:p.id, name:p.name, price:p.price, qty:1, photo:p.photo, tier:'retail', unit:p.unit||'ခု' });
  }
  renderScreen();
}

/* Picks the price for a given tier, falling back to the retail price when
   that product doesn't have a wholesale/VIP price set. */
function tierPrice(p, tier){
  if(tier === 'wholesale') return p.priceWholesale || p.price;
  if(tier === 'vip') return p.priceVIP || p.price;
  return p.price;
}
function tierLabel(tier){
  return tier === 'wholesale' ? 'လက်ကား' : tier === 'vip' ? 'VIP' : 'လက်လီ';
}
function setCartLineTier(id, tier){
  const line = state.cart.find(c => c.id === id);
  const p = state.products.find(x => x.id === id);
  if(!line || !p) return;
  line.tier = tier;
  line.price = tierPrice(p, tier);
  renderCartSheetContent();
  renderCartBar();
}
function setCartLineUnit(id, unit){
  const line = state.cart.find(c => c.id === id);
  if(!line) return;
  line.unit = unit;
  // no re-render needed — the <select> already reflects the chosen value
}

function renderCartBar(){
  let existing = document.getElementById('cart-bar');
  if(existing) existing.remove();
  if(state.cart.length === 0) return;
  const total = cartTotal();
  const count = state.cart.reduce((a,c)=>a+c.qty,0);
  const div = document.createElement('div');
  div.id = 'cart-bar';
  div.className = 'show';
  div.onclick = openCartSheet;
  div.innerHTML = `
    <div>
      <div class="cb-left">${count} ခု ရွေးထားသည်</div>
      <div class="cb-total">${money(total)}</div>
    </div>
    <div class="btn btn-accent">စျေးခြင်းလှည်း ကြည့်ရန် →</div>
  `;
  document.getElementById('screen').appendChild(div);
}

function cartSubtotal(){ return state.cart.reduce((a,c)=>a + c.price*c.qty, 0); }
function cartTotal(){
  const sub = cartSubtotal();
  const disc = sub * (state.discountPct/100);
  return Math.max(0, sub - disc);
}

function openCartSheet(){
  renderCartSheetContent();
  document.getElementById('sheet-overlay').classList.add('show');
}
function closeSheet(){
  document.getElementById('sheet-overlay').classList.remove('show');
  stopBarcodeScanner();
}

function setPaymentType(t){
  state.paymentType = t;
  renderCartSheetContent();
}
function onDebtBookSelect(v){
  state.checkoutDebtBookId = v;
  state.checkoutDebtCustomerId = null;
  renderCartSheetContent();
}
function onDebtCustomerSelect(v){
  state.checkoutDebtCustomerId = v;
  renderCartSheetContent();
}

function payBtn(val, emoji, label){
  return `<div class="pay-btn ${state.paymentMethod===val?'active':''}" onclick="setPayment('${val}')"><span class="pe">${emoji}</span>${label}</div>`;
}
function setPayment(v){ state.paymentMethod = v; renderCartSheetContent(); }
function setDiscount(v){ state.discountPct = Math.min(100, Math.max(0, Number(v)||0)); renderCartSheetContent(); }

function changeCartQty(id, delta){
  const line = state.cart.find(c => c.id === id);
  if(!line) return;
  const product = state.products.find(p => p.id === id);
  line.qty += delta;
  if(line.qty <= 0){ state.cart = state.cart.filter(c => c.id !== id); }
  else if(product && line.qty > product.stock){ line.qty = product.stock; showToast('လက်ကျန်ပစ္စည်း ပြည့်သွားပါပြီ'); }
  renderCartSheetContent();
  renderCartBar();
}

function clearCart(){
  state.cart = [];
  state.discountPct = 0;
  closeSheet();
  renderScreen();
}

async function checkout(){
  if(state.cart.length === 0) return;

  let customerName = '', customerPhone = '', debtBookId = null, debtCustomerId = null;

  if(state.paymentType === 'credit'){
    await refreshDebtBooksBeforeWrite();
    let bookId = state.checkoutDebtBookId;
    if(!bookId){ showToast('အကြွေးစာရင်းစာအုပ် ရွေးပါ'); return; }
    if(bookId === '__new__'){
      const newBookName = (document.getElementById('co-newbook')||{}).value?.trim();
      if(!newBookName){ showToast('အကြွေးစာရင်းစာအုပ် အမည် ထည့်ပါ'); return; }
      const book = { id: uid(), name: newBookName, customers: [] };
      state.debtBooks.push(book);
      bookId = book.id;
    }
    const book = state.debtBooks.find(b => b.id === bookId);
    if(!book){ showToast('အကြွေးစာရင်းစာအုပ် ရှာမတွေ့ပါ'); return; }

    let custId = state.checkoutDebtCustomerId;
    if(!custId){ showToast('ဖောက်သည် ရွေးပါ'); return; }
    if(custId === '__new__'){
      const newCustName = (document.getElementById('co-newcustomer')||{}).value?.trim();
      if(!newCustName){ showToast('ဖောက်သည်အမည် ထည့်ပါ'); return; }
      const newCustPhone = (document.getElementById('co-newcustomerphone')||{}).value?.trim() || '';
      const cust = { id: uid(), name: newCustName, phone: newCustPhone, entries: [] };
      book.customers.push(cust);
      custId = cust.id;
      customerName = newCustName; customerPhone = newCustPhone;
    } else {
      const cust = book.customers.find(c => c.id === custId);
      if(!cust){ showToast('ဖောက်သည် ရှာမတွေ့ပါ'); return; }
      customerName = cust.name; customerPhone = cust.phone || '';
    }
    debtBookId = bookId;
    debtCustomerId = custId;
  } else {
    customerName = state.checkoutCustomerName.trim();
    customerPhone = state.checkoutCustomerPhone.trim();
  }

  const sub = cartSubtotal();
  const total = cartTotal();
  const cashier = state.staff.find(s => s.id === state.currentStaffId);
  const sale = {
    id: uid(),
    time: Date.now(),
    items: state.cart.map(c => ({ id:c.id, name:c.name, price:c.price, qty:c.qty, tier:c.tier||'retail', unit:c.unit||'' })),
    subtotal: sub,
    discountPct: state.discountPct,
    total: total,
    paymentType: state.paymentType,
    paymentMethod: state.paymentType === 'credit' ? 'credit' : state.paymentMethod,
    cashierName: cashier ? cashier.name : null,
    customer: (customerName || customerPhone) ? { name: customerName, phone: customerPhone } : null,
    debtBookId, debtCustomerId,
  };
  const changedProducts = [];
  state.cart.forEach(c => {
    const p = state.products.find(x => x.id === c.id);
    if(p){ p.stock = Math.max(0, p.stock - c.qty); changedProducts.push(p); }
  });
  state.sales.push(sale);

  let debtBookToSave = null;
  if(state.paymentType === 'credit' && debtBookId && debtCustomerId){
    const book = state.debtBooks.find(b => b.id === debtBookId);
    const cust = book && book.customers.find(c => c.id === debtCustomerId);
    if(cust){
      cust.entries.push({ id: uid(), date: Date.now(), amount: total, note: `အော်ဒါ #${sale.id.slice(-5).toUpperCase()}`, type:'debt', saleId: sale.id, recordedBy: currentStaffName() });
      debtBookToSave = book;
    }
  }

  // Show the receipt immediately — the sale is already fully recorded in
  // local state, so the person shouldn't have to wait on a network round
  // trip just to see the voucher. The actual cloud save happens right
  // after, in the background; if it fails, a toast says so and the
  // background auto-sync will retry shortly.
  const saleId = sale.id;
  state.cart = [];
  state.discountPct = 0;
  state.checkoutCustomerName = '';
  state.checkoutCustomerPhone = '';
  state.checkoutDebtBookId = null;
  state.checkoutDebtCustomerId = null;
  state.paymentType = 'cash';
  closeSheet();
  renderScreen();
  openReceipt(saleId, true);

  setSyncStatus('syncing');
  Promise.all([
    saveSaleRecord(sale),
    saveProductRecords(changedProducts),
    debtBookToSave ? saveDebtBookRecord(debtBookToSave) : Promise.resolve(),
  ]).then(() => {
    setSyncStatus('ok');
  }).catch(() => {
    setSyncStatus('err');
    showToast('⚠️ Cloud သို့ သိမ်းဆည်းရာတွင် အနည်းငယ် ကြန့်ကြာနေသည် — sync အလိုအလျောက် ပြန်စမ်းပါမည်');
  });
}

      ${ state.settings.homePhones ? `<div class="rv-phones">အိမ်ဖုန်း - ${escapeAttr(state.settings.homePhones)}</div>` : '' }

      <div class="rv-meta">
        <div><span>ဝယ်သူအမည် - ${s.customer && s.customer.name ? escapeAttr(s.customer.name) : '.......................'}</span><span>ဖုန်း - ${s.customer && s.customer.phone ? escapeAttr(s.customer.phone) : '..............'}</span></div>
        <div><span>ရောင်းသူအမည် - ${s.cashierName ? escapeAttr(s.cashierName) : '.......................'}</span><span>ရက်စွဲ - ${dateStr}</span></div>
      </div>

      <table class="rv-table">
        <tr><th>အမျိုးအမည်</th><th>အရေအတွက်</th><th>နှုန်း</th><th>သင့်ငွေ</th></tr>
        ${ s.items.map(it => `
          <tr>

            <td class="num">${it.qty}${it.unit ? ' '+escapeAttr(it.unit) : ''}</td>

        ${ s.discountPct>0 ? `

        ` : '' }

/* Voiding never deletes the sale — it stays in history (crossed out) for
   the audit trail, but is excluded from every revenue/profit total.
   Stock is put back, and a credit sale's debt entry is reversed with a
   new offsetting entry (never edited/removed) so the ledger still shows
   exactly what happened. */
async function voidSalePrompt(saleId){
  const s = state.sales.find(x => x.id === saleId);
  if(!s || s.voided) return;
  if(!confirm(`ဒီအရောင်း (${money(s.total)}) ကို ပယ်ဖျက်မှာ သေချာပါသလား? ကုန်ပစ္စည်း လက်ကျန်ပြန်တိုးမည်ဖြစ်ပြီး ဤလုပ်ဆောင်ချက်ကို ပြန်ပြင်၍မရပါ။`)) return;
  if(!requireOwnerPin('အရောင်း ပယ်ဖျက်ခြင်း')) return;
  const reason = (prompt('ပယ်ဖျက်ရသည့် အကြောင်းရင်း (ရွေးချယ်ခွင့်)') || '').trim();

  const changedProducts = [];
  s.items.forEach(it => {
    const p = state.products.find(x => x.id === it.id);
    if(p){ p.stock += it.qty; changedProducts.push(p); }
  });

  let debtBookToSave = null;
  if(s.paymentType === 'credit' && s.debtBookId && s.debtCustomerId){
    await refreshDebtBooksBeforeWrite();
    const book = state.debtBooks.find(b => b.id === s.debtBookId);
    const cust = book && book.customers.find(c => c.id === s.debtCustomerId);
    if(cust){
      cust.entries.push({
        id: uid(), date: Date.now(), amount: s.total, type: 'payment',
        note: `အော်ဒါ #${s.id.slice(-5).toUpperCase()} ပယ်ဖျက်ခြင်း`,
        recordedBy: currentStaffName(),
      });
      debtBookToSave = book;
    }
  }

  s.voided = true;
  s.voidedAt = Date.now();
  s.voidedBy = currentStaffName();
  s.voidReason = reason;

  openReceipt(saleId); // optimistic UI — refresh immediately, save in background
  showToast('အရောင်း ပယ်ဖျက်ပြီးပါပြီ');

  setSyncStatus('syncing');
  Promise.all([
    saveSaleRecord(s),
    saveProductRecords(changedProducts),
    debtBookToSave ? saveDebtBookRecord(debtBookToSave) : Promise.resolve(),
  ]).then(() => setSyncStatus('ok'))
    .catch(() => { setSyncStatus('err'); showToast('⚠️ Cloud သို့ သိမ်းဆည်းရာတွင် ကြန့်ကြာနေသည်'); });
}

/* Reads the chosen/captured photo, downsizes it on a canvas (long edge
   capped at 300px, JPEG ~70% quality) and keeps it as a small base64 data
   URL — a phone photo straight off the camera can be several MB, which
   would blow well past Firestore's 1MB-per-document limit and slow every
   product list load back down to the crawl we just fixed. */
function handleProductPhoto(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 300;
      let w = img.width, h = img.height;
      if(w > h){ if(w > MAX){ h = Math.round(h * MAX/w); w = MAX; } }
      else { if(h > MAX){ w = Math.round(w * MAX/h); h = MAX; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
      window.__pendingPhoto = dataUrl;
      const preview = document.getElementById('pf-photo-preview');
      if(preview) preview.innerHTML = `<img src="${dataUrl}" style="width:100%; height:100%; object-fit:cover;">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveProductForm(id){
  const name = document.getElementById('pf-name').value.trim();
  let category = document.getElementById('pf-category').value;
  const newCat = document.getElementById('pf-newcat').value.trim();
  const price = Number(document.getElementById('pf-price').value) || 0;
  const priceWholesale = Number(document.getElementById('pf-price-whole').value) || 0;
  const priceVIP = Number(document.getElementById('pf-price-vip').value) || 0;
  let costUnit = document.getElementById('pf-costunit').value;
  const newUnit = document.getElementById('pf-newunit').value.trim();
  const costValue = Number(document.getElementById('pf-costvalue').value) || 0;
  const stock = Number(document.getElementById('pf-stock').value) || 0;
  let unit = document.getElementById('pf-unit').value;
  const newUnit2 = document.getElementById('pf-newunit2').value.trim();
  const barcode = document.getElementById('pf-barcode').value.trim();

  if(!name){ showToast('ကုန်ပစ္စည်းအမည် ထည့်ပါ'); return; }
  if(barcode){
    const dup = state.products.find(p => p.barcode === barcode && p.id !== id);
    if(dup && !confirm(`ဒီ barcode ကို "${dup.name}" မှာ သုံးပြီးသားပါ — ဆက်သိမ်းမှာလား?`)) return;
  }
  if(category === '__new__'){
    if(!newCat){ showToast('အမျိုးအစားအမည် ထည့်ပါ'); return; }
    category = newCat;
    if(!state.categories.includes(category)) state.categories.push(category);
  }
  let costUnitsChanged = false;
  if(costUnit === '__new__'){
    if(!newUnit){ showToast('ယူနစ်အမည် ထည့်ပါ'); return; }
    costUnit = newUnit;
    if(!state.costUnits.includes(costUnit)){ state.costUnits.push(costUnit); costUnitsChanged = true; }
  }
  let unitOptionsChanged = false;
  if(unit === '__new__'){
    if(!newUnit2){ showToast('ယူနစ်အမည် ထည့်ပါ'); return; }
    unit = newUnit2;
    if(!state.unitOptions.includes(unit)){ state.unitOptions.push(unit); unitOptionsChanged = true; }
  }

  const extra = { priceWholesale, priceVIP, costUnit, costValue, unit, barcode, photo: window.__pendingPhoto || null };
  let savedProduct;
  if(id){
    const p = state.products.find(x => x.id === id);
    Object.assign(p, { name, category, price, stock }, extra);
    savedProduct = p;
  } else {
    savedProduct = Object.assign({ id: uid(), name, category, price, stock }, extra);
    state.products.push(savedProduct);
  }

  closeSheet();
  renderScreen();
  showToast(id ? 'ပြင်ဆင်ပြီးပါပြီ' : 'ထည့်သွင်းပြီးပါပြီ');

  setSyncStatus('syncing');
  Promise.all([
    saveProductRecords([savedProduct]),
    saveCategories(),
    costUnitsChanged ? saveCostUnits() : Promise.resolve(),
    unitOptionsChanged ? saveUnitOptions() : Promise.resolve(),
  ]).then(() => setSyncStatus('ok'))
    .catch(() => { setSyncStatus('err'); showToast('⚠️ Cloud သို့ သိမ်းဆည်းရာတွင် ကြန့်ကြာနေသည်'); });
}

/* Profit uses each item's price AT THE TIME it was sold (already recorded
   in the sale) against the product's CURRENT cost value. Items whose
   product has since been deleted, or never had a cost entered, are
   skipped and counted separately rather than silently treated as zero
   cost (which would overstate profit). */
function profitFromSales(sales){
  let total = 0;
  let unknownCount = 0;
  const seenUnknown = new Set();
  const byProductMap = {};
  sales.filter(s => !s.voided).forEach(s => s.items.forEach(it => {
    const p = state.products.find(x => x.id === it.id);
    if(!p || !p.costValue){
      if(!seenUnknown.has(it.id)){ seenUnknown.add(it.id); unknownCount++; }
      return;
    }
    const profit = (it.price - p.costValue) * it.qty;
    total += profit;
    byProductMap[it.name] = (byProductMap[it.name]||0) + profit;
  }));
  const byProduct = Object.entries(byProductMap).sort((a,b)=>b[1]-a[1]);
  return { total, unknownCount, byProduct };
}
function drawChart(){
  const canvas = document.getElementById('salesChart');
  if(!canvas || typeof Chart === 'undefined') return;
  const days = last7Days();
  const labels = days.map(d => d.getDate()+'/'+(d.getMonth()+1));
  const totals = days.map(d => state.sales.filter(s => isSameDay(s.time, d) && !s.voided).reduce((a,s)=>a+s.total,0));
  if(__chartInstance) __chartInstance.destroy();
  __chartInstance = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: { labels, datasets: [{ data: totals, backgroundColor: '#0B4D3C', borderRadius: 6, maxBarThickness: 28 }] },
    options: {
      plugins: { legend: { display:false } },
      scales: { y: { beginAtZero:true, ticks:{ font:{ size:10 } } }, x: { ticks:{ font:{ size:11 } } } }
    }
  });
}

/* Robust clipboard copy. navigator.clipboard needs a "secure context" (https,
   or localhost) — a file:// page (a downloaded .html file opened directly)
   does not count, so navigator.clipboard can be missing or silently reject
   there. This tries the modern API first, then falls back to a hidden
   textarea + document.execCommand('copy'), which does work on file://. */
async function copyTextToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
    try{ await navigator.clipboard.writeText(text); return true; }catch(e){ /* fall through to fallback */ }
  }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){
    return false;
  }
}

async function saveStaffForm(id){
  const name = document.getElementById('sf-name').value.trim();
  const pin = document.getElementById('sf-pin').value.trim();
  const isOwner = document.getElementById('sf-owner').checked;
  const errEl = document.getElementById('sf-err');
  if(!name){ errEl.textContent = 'ဝန်ထမ်းအမည် ထည့်ပါ'; return; }
  if(!/^\d{4}$/.test(pin)){ errEl.textContent = 'PIN သည် ဂဏန်း ၄ လုံး ဖြစ်ရပါမည်'; return; }
  const dup = state.staff.find(s => s.pin === pin && s.id !== id);
  if(dup){ errEl.textContent = 'ဒီ PIN ကို ' + dup.name + ' အသုံးပြုနေပါသည်'; return; }

    Object.assign(s, { name, pin, isOwner });

  setSyncStatus('ok');
  closeSheet();
  renderScreen();

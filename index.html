/* ============ DEBT BOOKS (အကြွေးစာရင်းစာအုပ်) ============ */
function debtBalance(customer){
  return customer.entries.reduce((sum, e) => sum + (e.type === 'payment' ? -e.amount : e.amount), 0);
}

const DEBT_WARN_DAYS = 30;
const DEBT_DANGER_DAYS = 60;

/* How many days the OLDEST still-unpaid debt has been outstanding.
   Payments aren't tied to a specific purchase, so this applies them
   oldest-debt-first (FIFO) to work out which debt entries are actually
   still uncovered, then ages the earliest of those. Returns null when
   the customer owes nothing. */
function debtAging(customer){
  const entries = [...customer.entries].sort((a,b) => a.date - b.date);
  let paymentPool = 0;
  const debts = [];
  entries.forEach(e => {
    if(e.type === 'payment') paymentPool += e.amount;
    else debts.push({ date: e.date, remaining: e.amount });
  });
  for(const d of debts){
    if(paymentPool <= 0) break;
    const applied = Math.min(paymentPool, d.remaining);
    d.remaining -= applied;
    paymentPool -= applied;
  }
  const oldestUnpaid = debts.find(d => d.remaining > 0.0001);
  if(!oldestUnpaid) return null;
  return Math.floor((Date.now() - oldestUnpaid.date) / 86400000);
}
function debtAgingBadge(days){
  if(days === null) return '';
  if(days >= DEBT_DANGER_DAYS) return ` <span style="color:var(--danger); font-weight:700;">⚠️ ${days} ရက် လွန်</span>`;
  if(days >= DEBT_WARN_DAYS) return ` <span style="color:var(--accent-dark); font-weight:700;">${days} ရက် လွန်</span>`;
  return '';
}

/* Exports every debt book to a real .xlsx workbook (via the SheetJS
   library) so it opens directly in Excel or Google Sheets — one sheet
   with each customer's current balance, and one with the full entry
   history, useful as an offline backup of the credit ledger. */
function exportDebtBooksXLSX(){
  if(typeof XLSX === 'undefined'){ showToast('Export library မတင်ရသေးပါ — network ချိတ်ဆက်မှု စစ်ပြီး ထပ်စမ်းပါ'); return; }
  if(state.debtBooks.length === 0){ showToast('အကြွေးစာရင်းစာအုပ် မရှိသေးပါ'); return; }

  const balanceRows = [['စာအုပ်','ဖောက်သည်','ဖုန်း','ကျန်ငွေ']];
  const entryRows = [['စာအုပ်','ဖောက်သည်','ဖုန်း','ရက်စွဲ','အမျိုးအစား','ပမာဏ','မှတ်ချက်']];

  state.debtBooks.forEach(book => {
    book.customers.forEach(c => {
      balanceRows.push([book.name, c.name, c.phone||'', debtBalance(c)]);
      [...c.entries].sort((a,b)=>a.date-b.date).forEach(e => {
        entryRows.push([
          book.name, c.name, c.phone||'',
          new Date(e.date).toISOString().slice(0,10),
          e.type==='payment' ? 'ပေးချေငွေ' : 'အကြွေး',
          e.amount, e.note||''
        ]);
      });
    });
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(balanceRows), 'ကျန်ငွေစုစုပေါင်း');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(entryRows), 'မှတ်တမ်းအသေးစိတ်');
  XLSX.writeFile(wb, `hasanpos-debtbooks-${dateStamp()}.xlsx`);
  showToast('အကြွေးစာရင်း Excel ဖိုင် Export ပြီးပါပြီ');
}

async function addExpense(){
  const amount = Number(document.getElementById('ex-amount').value) || 0;
  let category = document.getElementById('ex-category').value;
  const newCat = document.getElementById('ex-newcat').value.trim();
  const note = document.getElementById('ex-note').value.trim();

  if(!amount || amount <= 0){ showToast('ပမာဏ ထည့်ပါ'); return; }
  let catChanged = false;
  if(category === '__new__'){
    if(!newCat){ showToast('အမျိုးအစားအမည် ထည့်ပါ'); return; }
    category = newCat;
    if(!state.expenseCategories.includes(category)){ state.expenseCategories.push(category); catChanged = true; }
  }

  const expense = { id: uid(), date: Date.now(), amount, category, note, recordedBy: currentStaffName() };
  state.expenses.push(expense);

  openExpenseSheet(); // optimistic UI — refresh immediately, save in background
  showToast('ကုန်ကျစရိတ် မှတ်တမ်းတင်ပြီးပါပြီ');

  setSyncStatus('syncing');
  Promise.all([saveExpenseRecord(expense), catChanged ? saveExpenseCategories() : Promise.resolve()])
    .then(() => setSyncStatus('ok'))
    .catch(() => { setSyncStatus('err'); showToast('⚠️ Cloud သို့ သိမ်းဆည်းရာတွင် ကြန့်ကြာနေသည်'); });
}

async function addDebtPaymentPrompt(bookId, custId){
  const amtStr = prompt('ပေးချေငွေပမာဏ ထည့်ပါ');
  const amt = Number(amtStr);
  if(!amt || amt <= 0){ showToast('ပမာဏ မှန်ကန်စွာ ထည့်ပါ'); return; }
  await refreshDebtBooksBeforeWrite();
  const book = state.debtBooks.find(b => b.id === bookId);
  const cust = book && book.customers.find(c => c.id === custId);
  if(!cust){ showToast('ဖောက်သည် ရှာမတွေ့ပါ'); return; }
  cust.entries.push({ id: uid(), date: Date.now(), amount: amt, note: '', type: 'payment', recordedBy: currentStaffName() });
  setSyncStatus('syncing');
  await saveDebtBookRecord(book);
  setSyncStatus('ok');
  openDebtCustomerDetail(bookId, custId);
  showToast('ပေးချေမှု မှတ်တမ်းတင်ပြီးပါပြီ');
}

async function deleteDebtCustomerPrompt(bookId, custId){
  if(!confirm('ဒီဖောက်သည်၏ အကြွေးမှတ်တမ်းအားလုံး ဖျက်မှာသေချာပါသလား?')) return;
  if(!requireOwnerPin('ဖောက်သည် အကြွေးမှတ်တမ်း ဖျက်ခြင်း')) return;
  await refreshDebtBooksBeforeWrite();
  const book = state.debtBooks.find(b => b.id === bookId);
  if(!book){ showToast('စာအုပ် ရှာမတွေ့ပါ'); return; }
  book.customers = book.customers.filter(c => c.id !== custId);
  setSyncStatus('syncing');
  await saveDebtBookRecord(book);
  setSyncStatus('ok');
  openDebtBookDetail(bookId);
  showToast('ဖောက်သည် ဖျက်ပြီးပါပြီ');
}

async function firebaseClearCollection(name){
  try{
    const snap = await fsRecordCollection(name).get();
    await Promise.all(snap.docs.map(d => d.ref.delete()));
  }catch(e){}
}

async function resetShopData(){
  if(!confirm('ကုန်ပစ္စည်းနှင့် ရောင်းအားမှတ်တမ်း အားလုံး ဖျက်မှာသေချာပါသလား? ဤလုပ်ဆောင်ချက်ကို ပြန်ဖျက်၍မရပါ။')) return;
  state.products = [];
  state.sales = [];
  state.categories = ['အားလုံး'];
  state.staff = [];
  state.currentStaffId = null;
  state.archivedCount = 0;
  setSyncStatus('syncing');
  if(FIREBASE_READY){
    await Promise.all([
      firebaseClearCollection('products'),
      firebaseClearCollection('sales'),
      saveCategories(), saveStaff(),
      rawStoreSet(skey('sales_archive'), JSON.stringify([])),
    ]);
  } else {
    await Promise.all([saveProducts(), saveSales(), saveCategories(), saveStaff(), rawStoreSet(skey('sales_archive'), JSON.stringify([]))]);

  renderTopbar();
  renderScreen();
  showToast('ဒေတာအားလုံး ရှင်းလင်းပြီးပါပြီ');
}

/* The Firebase console hands people a JS snippet, not JSON — unquoted keys,
   single quotes, import lines, comments, a trailing initializeApp() call.
   This accepts any of those shapes. Note the key-quoting regex only matches
   after "{" or "," so it can't corrupt values that contain colons, which
   appId always does (e.g. "1:1234:web:abcd"). */
function parseFirebaseConfig(raw){
  if(!raw || !raw.trim()) return null;
  try{ return JSON.parse(raw); }catch(e){}
  try{
    let s = raw.replace(/\/\*[\s\S]*?\*\//g, '').replace(/\/\/[^\n]*/g, '');
    const m = s.match(/firebaseConfig\s*=\s*\{/);
    const start = m ? s.indexOf('{', m.index) : s.indexOf('{');
    if(start === -1) return null;
    let depth = 0, end = -1;
    for(let i = start; i < s.length; i++){
      if(s[i] === '{') depth++;
      else if(s[i] === '}'){ depth--; if(depth === 0){ end = i; break; } }
    }
    if(end === -1) return null;
    s = s.slice(start, end + 1);
    s = s.replace(/([{,]\s*)(?:"|')?([A-Za-z0-9_$]+)(?:"|')?(\s*):/g, '$1"$2"$3:');
    s = s.replace(/:\s*'([^']*)'/g, (mm, v) => ': ' + JSON.stringify(v));
    s = s.replace(/,(\s*})/g, '$1');
    return JSON.parse(s);
  }catch(e){ return null; }
}

async function saveFirebaseConfig(){
  const raw = document.getElementById('fb-config').value.trim();
  if(!raw){ showToast('Firebase config ထည့်ပါ'); return; }

    showToast('Config မှားနေပါသည် — apiKey နှင့် projectId ပါရပါမည်');

async function testAndSaveRemoteUrl(){
  const input = document.getElementById('remote-url-input');
  const url = input.value.trim();
  const errEl = document.getElementById('remote-url-err');
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){
    errEl.textContent = 'URL မှန်ကန်မှု မရှိပါ — script.google.com link ကို ကူးထည့်ပါ';
    return;
  }
  errEl.textContent = 'စစ်ဆေးနေသည်...';
  try{
    const testKey = 'hasanpos:__connection_test__';
    const res = await fetch(url, {
      method:'POST',
      headers: { 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'set', key: testKey, value: 'ok' }),
    });
    if(!res.ok) throw new Error('bad response');
    const check = await fetch(url + '?key=' + encodeURIComponent(testKey));
    const text = await check.text();
    if(text !== 'ok') throw new Error('mismatch');
  }catch(e){
    errEl.textContent = 'ချိတ်ဆက်မရပါ — Deploy setting (Anyone access) ကို ပြန်စစ်ပါ';
    return;
  }
  setRemoteUrlLocal(url);
  showToast('Google Sync ချိတ်ဆက်ပြီးပါပြီ! ပြန်စတင်နေသည်...');
  setTimeout(() => location.reload(), 900);
}
